<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" role="img" aria-label="WarpClip wordmark with sage accent">
  <title>WarpClip wordmark, sage accent on Clip</title>
  <defs>
    <style><![CDATA[
      @font-face {
        font-family: 'Geist';
        src: url('../../fonts/Geist-Bold.woff2') format('woff2');
        font-weight: 700; font-style: normal; font-display: block;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../fonts/Newsreader-Italic.ttf') format('truetype');
        font-weight: 500; font-style: italic; font-display: block;
      }
      .warp { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
              font-weight: 700; font-size: 110px; letter-spacing: -0.05em; }
      .clip { font-family: 'Newsreader', 'Iowan Old Style', 'Charter', Georgia, serif;
              font-weight: 500; font-style: italic; font-size: 118px; letter-spacing: -0.015em; }
    ]]></style>
  </defs>
  <text x="0" y="104" class="warp" fill="#000000">Warp</text>
  <text x="252" y="104" class="clip" fill="#6B8E6F">Clip</text>
</svg>
