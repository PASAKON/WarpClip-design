  </g>
  <g transform="translate(-2,1) skewX(-3) rotate(-0.4 380 60)">
    <path d="M288,38 L478,35 Q484,35 484,41 L485,82 Q485,88 480,88 L292,89 Q286,89 286,84 L286,44 Q286,38 288,38 Z" fill="#CCFF00"/>
  </g>
  <text x="104" y="75" class="wm-w" fill="#000000">Warp</text>
  <text x="284" y="75" class="wm-c" fill="#000000">Clip</text>
