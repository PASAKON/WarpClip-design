<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="WarpClip stacked lockup">
  <title>WarpClip stacked lockup, white tile + white wordmark for dark backgrounds</title>
  <defs>
    <style><![CDATA[
      @font-face {
        font-family: 'Geist';
        src: url('../../fonts/Geist-Bold.woff2') format('woff2');
        font-weight: 700; font-style: normal; font-display: block;
      }
      @font-face {
        font-family: 'Newsreader';
        src: url('../../fonts/Newsreader-Italic.ttf') format('truetype');
        font-weight: 500; font-style: italic; font-display: block;
      }
      .tile-w { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 48px; letter-spacing: -0.05em; }
      .tile-c { font-family: 'Newsreader', 'Iowan Old Style', 'Charter', Georgia, serif; font-weight: 500; font-style: italic; font-size: 53px; letter-spacing: -0.015em; }
      .wm-w { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 56px; letter-spacing: -0.05em; }
      .wm-c { font-family: 'Newsreader', 'Iowan Old Style', 'Charter', Georgia, serif; font-weight: 500; font-style: italic; font-size: 60px; letter-spacing: -0.015em; }
    ]]></style>
  </defs>
  <g transform="translate(140,8)">
    <rect x="0.5" y="0.5" width="79" height="79" rx="17.6" ry="17.6" fill="#FFFFFF" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
    <text x="10" y="55" class="tile-w" fill="#000000">W</text>
    <text x="44" y="55" class="tile-c" fill="#000000">c</text>
  </g>
  <text x="50" y="172" class="wm-w" fill="#FFFFFF">Warp</text>
  <text x="180" y="172" class="wm-c" fill="#FFFFFF">Clip</text>
</svg>
